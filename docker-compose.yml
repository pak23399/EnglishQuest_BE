version: "3.9"
services:
  db:
    image: postgres:16
    container_name: englishquest_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: englishquest
    ports:
      - "5432:5432"
    volumes:
      - englishquest_pgdata:/var/lib/postgresql/data
volumes:
  englishquest_pgdata:
